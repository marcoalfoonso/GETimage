<!DOCTYPE html>
<html>
<head>
    <title>Video desde cámara</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="get_q.js"></script>
</head>

<body>

<h2>Vista de cámara</h2>

<img id="camara" width="100%">

<script>

    const ws = new WebSocket("wss://threed-model-yvro.onrender.com");

    ws.binaryType = "blob";

    ws.onmessage = (event) => {
        const img = document.getElementById("camara");
        img.src = URL.createObjectURL(event.data);
    }

</script>

<div id="scope"></div>

</body>
</html>
